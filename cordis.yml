# --patch / bundle 清单加载插件: 在 Harness 内部启动 MCP server(8090), 暴露能力给外部 MCP 客户端(Hermes)
# 要求 dsh >= 0.1.1-rc.2(@deepseek-ai/* 为 peerDependencies, 与宿主共享单一副本)
- insert:
    - id: harness-mcp-server
      name: '@chushixixin/dsh-harness-mcp-server'
      config:
        http: true
        port: 8090
        host: 127.0.0.1        # 默认仅本机; 全网卡监听改 '0.0.0.0'(必须同时配 token, 见下)
        # taskTimeoutMs: 3600000   # 可选: 单次维护操作(如 session_compact)的超时毫秒数(默认 60 分钟, 0 = 不限制)
        # authToken: 'your-secret-token'     # 可选: Bearer token 认证(设置后所有请求必须带 Authorization: Bearer <token>)
        # authTokens: ['token-a', 'token-b'] # 可选: 多 token(任一命中放行; 与 authToken 并存, 多客户端各持一个)
        # workspaceRoots: ['/workspace']      # 可选: cwd 白名单(防路径穿越)
        # preset: 'standard'                  # 可选: setup 挂载的 agent preset
        # maxAgents: 8                        # 可选: 常驻 agent 会话上限(LRU 淘汰)
        # 派活=session_send(投喂一个 turn 后立即返回), 查询=session_status/session_tail —— 无任务队列/TTL 配置
